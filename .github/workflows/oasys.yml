name: OASYS KronosPlayer Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "KronosPlayer-v0.2-GitHub-ready.zip"
      - ".github/workflows/oasys.yml"

permissions:
  contents: read

jobs:
  linux-core:
    name: Linux core tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source
        run: |
          rm -rf source build-linux
          mkdir source
          unzip -q KronosPlayer-v0.2-GitHub-ready.zip -d source

      - name: Configure
        run: |
          cmake -S source -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DKRONOSPLAYER_BUILD_MAC_APP=OFF \
            -DKRONOSPLAYER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-linux --parallel 2

      - name: Test
        run: ctest --test-dir build-linux --output-on-failure

  macos-intel:
    name: macOS Intel x86_64
    runs-on: macos-15-intel
    needs: linux-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          uname -a
          uname -m
          xcodebuild -version
          cmake --version

      - name: Unpack source
        run: |
          rm -rf source build-mac
          mkdir source
          unzip -q KronosPlayer-v0.2-GitHub-ready.zip -d source

      - name: Configure Xcode project
        run: |
          cmake -S source -B build-mac -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DKRONOSPLAYER_BUILD_MAC_APP=ON \
            -DKRONOSPLAYER_BUILD_TESTS=ON

      - name: Build Release
        run: cmake --build build-mac --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build-mac -C Release --output-on-failure

      - name: Find app
        id: app
        shell: bash
        run: |
          APP="$(find build-mac -type d -name 'KronosPlayer.app' | head -n 1)"
          if [ -z "$APP" ]; then
            echo "KronosPlayer.app was not produced."
            find build-mac -maxdepth 6 -type d -name '*.app' -print
            exit 1
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"

      - name: Verify Intel binary
        shell: bash
        run: |
          BIN="${{ steps.app.outputs.path }}/Contents/MacOS/KronosPlayer"
          test -f "$BIN"
          file "$BIN"
          lipo -info "$BIN"

      - name: Package app
        shell: bash
        run: |
          rm -f KronosPlayer-v0.2-macOS-Intel.zip
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.app.outputs.path }}" \
            KronosPlayer-v0.2-macOS-Intel.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: KronosPlayer-v0.2-macOS-Intel
          path: KronosPlayer-v0.2-macOS-Intel.zip
          if-no-files-found: error
          retention-days: 30
